name: Release

# Publishes to PyPI via Trusted Publishing (OIDC) - no API token stored.
# Configure the trusted publisher for `woku` on PyPI first:
#   PyPI project -> Publishing -> add GitHub publisher
#   (owner: wokuApp, repo: woku-python, workflow: release.yml, environment: pypi)
# Then publish a GitHub Release whose tag matches the version in _version.py.

on:
  release:
    types: [published]

jobs:
  publish:
    name: build + publish to PyPI
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # required for Trusted Publishing (OIDC)
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync

      - name: Verify the release tag matches the package version
        run: |
          version=$(uv run python -c "from woku import __version__; print(__version__)")
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "Release tag '$tag' does not match woku version '$version'." >&2
            exit 1
          fi

      - name: Verify gate before publishing
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run pyright
          uv run pytest -q

      - name: Build sdist + wheel
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
